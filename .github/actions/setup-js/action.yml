# action.yml — shared setup for CI jobs that need Node and pnpm.
# Why: several jobs need the same steps; one copy keeps their versions identical.
# How it connects: used by .github/workflows/ci.yml after actions/checkout (a local
# action can only run once the repository is checked out). pnpm's version comes
# from package.json `packageManager`, Node's from .nvmrc.
name: Set up Node and pnpm
description: Install the pinned pnpm and Node, then the workspace dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies (lockfile must match)
      run: pnpm install --frozen-lockfile
      shell: bash
