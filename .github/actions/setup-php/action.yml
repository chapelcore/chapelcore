# action.yml — shared setup for CI jobs that need PHP and Composer.
# Why: several jobs need the same PHP setup; one copy keeps the Composer version and
# the list of Composer packages to install identical across jobs.
# How it connects: used by .github/workflows/ci.yml after actions/checkout. Installs
# the dev dependencies of every Composer package from its composer.lock (the contract
# and the PHP core; Laravel joins in iteration 1.5).
name: Set up PHP and Composer
description: Install the requested PHP and the pinned Composer, then the Composer packages.
inputs:
  php-version:
    description: PHP version to install
    default: '8.5'
  install:
    description: Install the Composer packages ('false' for jobs that only read composer.lock)
    default: 'true'
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs.php-version }}
        tools: composer:2.10.3
        coverage: none
    - name: Install Composer packages (lockfiles must match)
      if: inputs.install == 'true'
      run: |
        for dir in libs/shared/contract libs/php/native/core; do
          composer install --working-dir="$dir" --no-interaction --no-progress
        done
      shell: bash
