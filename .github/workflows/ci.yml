# ci.yml — the checks every pull request must pass before it can merge.
# Why: CLAUDE.md "Never merge on red" and "CI/CD for everything that can be automated".
# Each job name is a required check in the dev, staging and main rulesets
# (docs/runbooks/github-repository.md, P2): renaming a job means updating the
# rulesets in the same PR.
# How it connects: placeholder jobs print a warning and are replaced by the iteration
# that brings their real tests (docs/plans/phase-1.md §8; contrast in Phase 2).
name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - name: Every dependency and action is pinned
        run: pnpm check:pins
      - name: Formatting (Prettier)
        run: pnpm format:check
      - name: Lint every workspace package
        run: pnpm lint
      - uses: ./.github/actions/setup-php
      - name: PHP formatting (Pint, PER Coding Style)
        run: |
          composer --working-dir=libs/shared/contract format:check
          composer --working-dir=libs/php/native/core format:check
      - name: PHP formatting (Pint, Laravel preset) on the Laravel app
        run: composer --working-dir=apps/api/laravel format:check

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - name: Type-check every workspace package
        run: pnpm type-check
      - uses: ./.github/actions/setup-php
      - name: PHPStan (max level) on the PHP core
        run: composer --working-dir=libs/php/native/core analyse
      - name: PHPStan (max level, Larastan) on the Laravel app
        run: composer --working-dir=apps/api/laravel analyse

  test-php:
    name: test-php (${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4'] # production target, oldest supported
    services:
      # The real database for the Laravel tests: the version on the host (Docker
      # Official Image, approved 2026-11-01). The credentials match phpunit.xml's
      # defaults; they are throwaway test values, not secrets.
      mariadb:
        image: mariadb:11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
        env:
          MARIADB_DATABASE: chapelcore_test
          MARIADB_USER: chapelcore_test
          MARIADB_PASSWORD: chapelcore_test
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
      - name: Show versions
        run: php --version && composer --version
      - name: Contract self-tests (PHPUnit, this PHP version)
        run: composer --working-dir=libs/shared/contract test
      - name: PHP core tests (PHPUnit, this PHP version)
        run: composer --working-dir=libs/php/native/core test
      - name: Laravel app tests (PHPUnit, real MariaDB, this PHP version)
        run: composer --working-dir=apps/api/laravel test

  test-js:
    name: test-js
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - name: Repository scripts (node --test)
        run: pnpm test:scripts
      - name: Test every workspace package
        run: pnpm test

  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - uses: ./.github/actions/setup-php
      - name: Contract self-tests in TypeScript (ajv)
        run: pnpm --filter @chapelcore/contract test
      - name: Contract self-tests in PHP (opis)
        run: composer --working-dir=libs/shared/contract test
      # From iteration 1.8, this job also validates the running API's responses.

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Placeholder until the end-to-end suite exists
        run: echo "::warning title=Placeholder::Playwright end-to-end tests arrive in iteration 1.8."

  contrast:
    name: contrast
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Placeholder until the theme exists
        run: echo "::warning title=Placeholder::The WCAG AA contrast gate arrives with the theme in Phase 2."

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - name: Known vulnerabilities in npm packages (any finding fails)
        run: pnpm audit
      - uses: ./.github/actions/setup-php
        with:
          install: 'false'
      - name: Known vulnerabilities in Composer packages (any finding fails)
        run: |
          composer audit --locked --working-dir=libs/shared/contract
          composer audit --locked --working-dir=libs/php/native/core
          composer audit --locked --working-dir=apps/api/laravel
