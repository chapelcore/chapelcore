# ci.yml — the checks every pull request must pass before it can merge.
# Why: CLAUDE.md "Never merge on red" and "CI/CD for everything that can be automated".
# Each job name is a required check in the dev, staging and main rulesets
# (docs/runbooks/github-repository.md, P2): renaming a job means updating the
# rulesets in the same PR.
# How it connects: placeholder jobs print a warning and are replaced by the iteration
# that brings their real tests (docs/plans/phase-1.md §8; contrast in Phase 2).
name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - name: Every dependency and action is pinned
        run: pnpm check:pins
      - name: Formatting (Prettier)
        run: pnpm format:check
      - name: Lint every workspace package
        run: pnpm lint

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - name: Type-check every workspace package
        run: pnpm type-check
      - name: Placeholder until PHPStan arrives
        run: echo "::warning title=Placeholder::PHPStan joins in iteration 1.4 (libs/php/native/core)."

  test-php:
    name: test-php (${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4'] # production target, oldest supported
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10.3
          coverage: none
      - name: Show versions
        run: php --version && composer --version
      - name: Placeholder until PHP packages exist
        run: echo "::warning title=Placeholder::PHPUnit arrives in iteration 1.4 (libs/php/native/core)."

  test-js:
    name: test-js
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - name: Repository scripts (node --test)
        run: pnpm test:scripts
      - name: Test every workspace package
        run: pnpm test

  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Placeholder until the contract exists
        run: echo "::warning title=Placeholder::Contract tests arrive in iteration 1.3 (libs/shared/contract)."

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Placeholder until the end-to-end suite exists
        run: echo "::warning title=Placeholder::Playwright end-to-end tests arrive in iteration 1.8."

  contrast:
    name: contrast
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Placeholder until the theme exists
        run: echo "::warning title=Placeholder::The WCAG AA contrast gate arrives with the theme in Phase 2."

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - name: Known vulnerabilities in npm packages (any finding fails)
        run: pnpm audit
      # composer audit joins in iteration 1.4, when the first composer.lock exists.
