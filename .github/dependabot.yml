# dependabot.yml — weekly version-update PRs for npm packages and GitHub Actions.
# Why: versions are pinned exactly (CLAUDE.md), so upgrades must arrive as reviewed
# PRs. How it connects: PRs target `dev` and pass CI like any other change; the
# 7-day cooldown skips releases younger than a week. Each Composer package gets its
# own entry (the contract and the PHP core now; Laravel in iteration 1.5).
# Major upgrades of the packages listed under `ignore` are done by hand, in their own
# reviewed PR; remove the rule in that PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Denver
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    ignore:
      # Node types follow the Node line in .nvmrc (24); move both together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (the Go rewrite) is reviewed as its own PR before adoption.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build(deps)

  - package-ecosystem: composer
    directory: /libs/shared/contract
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Denver
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns: ['*']
    commit-message:
      prefix: build(deps)

  - package-ecosystem: composer
    directory: /libs/php/native/core
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Denver
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns: ['*']
    ignore:
      # Local path package: its version is the DOMAIN-MODEL version, changed by hand.
      - dependency-name: chapelcore/contract
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Denver
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
